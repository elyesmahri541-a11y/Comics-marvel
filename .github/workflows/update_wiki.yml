name: Mettre à jour le Wiki Marvel

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les outils nécessaires
        run: pip install requests beautifulsoup4

      - name: Lancer le script de mise à jour
        run: python script.py

      - name: Envoyer les changements sur le site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Mise à jour automatique des fiches Marvel" || exit 0
          git push
