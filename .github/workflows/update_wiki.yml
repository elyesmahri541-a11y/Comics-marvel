      - name: Lancer le script de téléchargement des comics récents
        run: |
          python - <<'EOF'
          import os
          import requests
          import re
          from bs4 import BeautifulSoup

          if not os.path.exists("docs"):
              os.makedirs("docs")

          print("Recherche des derniers comics...")
          
          # On interroge l'API de Fandom pour récupérer les pages de comics récents ou de la catégorie de l'année en cours
          url_cat = "https://marvel.fandom.com/api.php?action=query&list=categorymembers&cmtitle=Category:2026_Comics&cmlimit=20&format=json"
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          try:
              response = requests.get(url_cat, headers=headers).json()
              pages = response.get("query", {}).get("categorymembers", [])
              
              if not pages:
                  # Si la catégorie spécifique n'a pas renvoyé de résultats, on prend une liste de secours
                  pages = [{"title": "Amazing Spider-Man Vol 7 1"}, {"title": "Avengers Vol 9 1"}]

              for item in pages:
                  titre_page = item["title"]
                  # On évite les pages spéciales du wiki
                  if "Category:" in titre_page or "Talk:" in titre_page:
                      continue
                      
                  print(f"Téléchargement du comic : {titre_page}...")
                  url_parse = f"https://marvel.fandom.com/api.php?action=parse&page={titre_page.replace(' ', '_')}&format=json"
                  
                  res_parse = requests.get(url_parse, headers=headers).json()
                  if "parse" in res_parse:
                      contenu_html = res_parse["parse"]["text"]["*"]
                      contenu_propre = re.sub(r'href="/wiki/', r'href="./', contenu_html)
                      
                      nom_fichier = f"docs/{titre_page.replace(' ', '_').replace('/', '_')}.html"
                      with open(nom_fichier, "w", encoding="utf-8") as f:
                          f.write(f"<h1>{titre_page}</h1>\n")
                          f.write(contenu_propre)
                      print(f"Comic '{titre_page}' enregistré !")
          except Exception as e:
              print(f"Erreur : {e}")
          EOF

