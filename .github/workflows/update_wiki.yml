name: Mettre à jour le Wiki Marvel

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les outils nécessaires
        run: pip install requests beautifulsoup4

      - name: Lancer le script de téléchargement
        run: |
          python - <<'EOF'
          import os
          import requests
          import re

          if not os.path.exists("docs"):
              os.makedirs("docs")

          pages_a_importer = [
              "Ricardo_Villanueva_(Earth-616)",
              "Spider-Man"
          ]

          for titre_page in pages_a_importer:
              print(f"Téléchargement de : {titre_page}...")
              url = f"https://marvel.fandom.com/api.php?action=parse&page={titre_page}&format=json"
              headers = {'User-Agent': 'Mozilla/5.0'}
              
              try:
                  response = requests.get(url, headers=headers).json()
                  if "parse" in response:
                      contenu_html = response["parse"]["text"]["*"]
                      contenu_propre = re.sub(r'href="/wiki/', r'href="./', contenu_html)
                      
                      nom_fichier = f"docs/{titre_page}.html"
                      with open(nom_fichier, "w", encoding="utf-8") as f:
                          f.write(f"<h1>{titre_page.replace('_', ' ')}</h1>\n")
                          f.write(contenu_propre)
                      print(f"Page '{titre_page}' enregistrée !")
                  else:
                      print(f"Page introuvable : {titre_page}")
              except Exception as e:
                  print(f"Erreur : {e}")
          EOF

      - name: Envoyer les changements sur le site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Mise à jour automatique des fiches Marvel" || exit 0
          git push
