name: Mettre a jour le Wiki Marvel

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les outils nécessaires
        run: pip install requests beautifulsoup4

      - name: Lancer le script de téléchargement des comics récents
        run: |
          python - <<'EOF'
          import os
          import requests
          import re

          if not os.path.exists("docs"):
              os.makedirs("docs")

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          print("Recherche des parutions récentes de la semaine sur Fandom...")

          # On cible directement la catégorie des comics sortis cette semaine
          categories_target = [
              "Category:Comics_Released_This_Week",
              "Category:Comics_Released_Today"
          ]

          titres_a_importer = set()

          for cat in categories_target:
              url_cat = f"https://marvel.fandom.com/api.php?action=query&list=categorymembers&cmtitle={cat}&cmlimit=100&format=json"
              try:
                  res = requests.get(url_cat, headers=headers).json()
                  members = res.get("query", {}).get("categorymembers", [])
                  for m in members:
                      title = m["title"]
                      if not title.startswith("Category:") and not title.startswith("File:") and not title.startswith("Talk:"):
                          titres_a_importer.add(title)
              except Exception as e:
                  print(f"Erreur sur la catégorie {cat}: {e}")

          print(f"Total de comics trouvés : {len(titres_a_importer)}")

          # Téléchargement et conversion de chaque fiche
          for titre in titres_a_importer:
              print(f"Importation : {titre}...")
              url_parse = f"https://marvel.fandom.com/api.php?action=parse&page={titre.replace(' ', '_')}&format=json"
              try:
                  res_parse = requests.get(url_parse, headers=headers).json()
                  if "parse" in res_parse:
                      contenu_html = res_parse["parse"]["text"]["*"]
                      
                      # Redirection des liens Fandom vers ton propre dossier local
                      contenu_propre = re.sub(r'href="/wiki/', r'href="./', contenu_html)

                      # Nettoyage du nom de fichier
                      nom_clean = titre.replace(' ', '_').replace('/', '_').replace(':', '_')
                      nom_fichier = f"docs/{nom_clean}.html"

                      with open(nom_fichier, "w", encoding="utf-8") as f:
                          f.write(f"<h1>{titre}</h1>\n")
                          f.write(contenu_propre)
                          
                      print(f"Enregistré : {nom_fichier}")
              except Exception as e:
                  print(f"Erreur lors du téléchargement de {titre}: {e}")
          EOF

      - name: Envoyer les changements sur le site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Mise à jour automatique des fiches Marvel de la semaine" || exit 0
          git push

